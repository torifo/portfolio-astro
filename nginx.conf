events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # 静的生成サイトなので、存在しないURLは素直に404を返す。
        # 以前は `/index.html` にフォールバックしていて、壊れたリンクでも
        # トップが200で出てしまい、リンク切れに気づけなかった。
        location / {
            try_files $uri $uri/ =404;
        }

        # Journey の入口はトップのセクション（各ページの「戻る」も /#journey）。/journey/ にページは無い
        location ~ ^/journey/?$ {
            absolute_redirect off;  # 前段のプロキシに書き換えられないよう相対で返す
            return 301 "/#journey";
        }

        # 404 の受け皿は Astro が出力する /404.html
        error_page 404 /404.html;
        # index.html の無いディレクトリ（/_astro/ など）は 403 になるので、404 と同じ扱いにする
        error_page 403 =404 /404.html;
        location = /404.html {
            internal;
        }

        # webp は以前どこにも当たらず、キャッシュの指示が無かった。そのうえデプロイのたびに更新日時（ETag）が変わるので、
        # デプロイの後はブラウザがすべての画像を取り直していた（2026-10-29）。
        # add_header を使わず expires だけにする（location で add_header すると、下の server のセキュリティヘッダーが消える）
        # 投稿のサムネ（/journey/thumbs/<投稿ID>.webp）は投稿ごとに名前が違い、中身は変わらないので長く持たせる
        location ~* ^/journey/thumbs/.+\.webp$ {
            expires 1y;
        }
        # そのほかの webp（旅・作品の背景など）は同じ名前のまま差し替えることがあるので、1時間だけ持たせる
        # （本人「1日未満でもいい。自動マージは日によって遅れるから」）
        location ~* \.webp$ {
            expires 1h;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}