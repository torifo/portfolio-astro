name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag
      id: tag
      run: echo "TAG=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

    - name: Create .env file
      run: |
        echo "PUBLIC_MICROCMS_API_KEY=${{ secrets.PUBLIC_MICROCMS_API_KEY }}" > .env
        echo "PUBLIC_MICROCMS_SERVICE_DOMAIN=${{ secrets.PUBLIC_MICROCMS_SERVICE_DOMAIN }}" >> .env

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build --no-cache \
          -t ghcr.io/torifo/portfolio-astro:${{ steps.tag.outputs.TAG }} \
          -t ghcr.io/torifo/portfolio-astro:latest \
          .
        docker push ghcr.io/torifo/portfolio-astro:${{ steps.tag.outputs.TAG }}
        docker push ghcr.io/torifo/portfolio-astro:latest

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /home/ubuntu/Web/portfolio-astro
          ./deploy.sh ${{ steps.tag.outputs.TAG }}
