name: Deploy to Production

on:
  push:
    branches: [ main ]
    # microCMS キャッシュの更新を戻す push で、またデプロイが走らないようにする
    paths-ignore:
      - 'data/microcms/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/torifo/portfolio-astro
  VPS_APP_DIR: /home/ubuntu/Web/portfolio-astro

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # microCMS キャッシュの更新を main へ戻すため

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Determine image tag
      id: meta
      run: echo "tag=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

    # ビルドは microCMS を呼ばない。ここで取り込んで data/microcms/*.json に置き、
    # Astro はそれを読む。取得に失敗した分はコミット済みの前回分がそのまま残るので、
    # microCMS が落ちていても最後に取れた内容でサイトが出る。
    - name: Fetch microCMS content
      env:
        PUBLIC_MICROCMS_API_KEY: ${{ secrets.PUBLIC_MICROCMS_API_KEY }}
        PUBLIC_MICROCMS_SERVICE_DOMAIN: ${{ secrets.PUBLIC_MICROCMS_SERVICE_DOMAIN }}
      run: node scripts/ingest/fetch_microcms.mjs

    - name: Log in to GHCR
      run: |
        echo "${{ secrets.GHCR_TOKEN }}" \
          | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

    - name: Build and push image
      run: |
        docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" .
        docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
        docker push "$IMAGE:latest"

    # VPS 側の deploy.sh をそのまま呼ぶ（手動デプロイと同じ経路）
    - name: Deploy on VPS
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
        ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
          "cd $VPS_APP_DIR && ./deploy.sh ${{ steps.meta.outputs.tag }}"

    # 取れた内容を次回の保険として残す。paths-ignore があるのでデプロイは再発火しない。
    - name: Commit refreshed microCMS cache
      run: |
        if git diff --quiet -- data/microcms; then
          echo "microCMS キャッシュに変化なし"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/microcms
        # -m を重ねると段落になる。ブロックスカラーの中に素の --- を置くと
        # YAML のドキュメント区切りと解釈されてワークフローが壊れる。
        git commit -m "Refresh microCMS cache" -m "---" -m "microCMS のキャッシュを更新"
        git push origin HEAD:main

    - name: Summary
      run: |
        echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
        echo "- image: \`$IMAGE:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- url: https://portorifo.riumu.net" >> "$GITHUB_STEP_SUMMARY"
        echo "- rollback: \`./deploy.sh <前のタグ>\` on VPS" >> "$GITHUB_STEP_SUMMARY"
